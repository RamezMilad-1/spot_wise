name: Deploy web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the GitHub Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      # Blank .env on purpose: the public web demo runs on built-in demo data,
      # so no API keys are baked into the shipped JavaScript bundle.
      - name: Create .env from template
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      # base-href must match the repo name for a project Pages site served at
      # https://<user>.github.io/spot_wise/
      - name: Build web
        run: flutter build web --release --base-href /spot_wise/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
